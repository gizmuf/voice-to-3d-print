name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1 libglib2.0-0 libgomp1 prusa-slicer
      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify Python and shell sources
        run: |
          python -m compileall -q backend/app.py backend/config.py backend/services backend/tests
          bash -n scripts/*.sh
          git diff --check
      - name: Run free backend suite
        working-directory: backend
        run: |
          python -m pytest -q tests \
            --ignore=tests/ai/evals/test_eval_runner.py \
            --ignore=tests/ai/evals_v2/test_eval_runner_v2.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_STT_URL: http://127.0.0.1:8010
        run: npm run build

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cad-to-print-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PULSAI_AUTH_REQUIRED: "false"
      PULSAI_INSECURE_LOCAL_DEV: "true"
      PULSAI_PUBLIC_SAFE_MODE: "true"
      PULSAI_ALLOW_PLATFORM_AI_SPEND: "false"
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_STT_URL: http://127.0.0.1:8010
      PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install CAD and slicer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1 libglib2.0-0 libgomp1 prusa-slicer
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Browser CAD-to-print flow
        run: |
          cd backend
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 >/tmp/pulsai-3d-backend.log 2>&1 &
          PULSAI_BACKEND_PID=$!
          trap 'kill "$PULSAI_BACKEND_PID"' EXIT
          cd ..
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          cd frontend
          npx playwright test tests/e2e/cad-to-print-free.spec.ts
